name: hypnose-eeg-env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip=25.1
  - pyarrow=21.0.0

  # Qt and its Linux XCB runtime belong in Conda so remote viewer sessions do
  # not depend on distribution-specific system packages. These provide the
  # native libraries used by PyQt's xcb platform plugin over SSH/X11.
  - "pyqt>=6.10,<7"
  - xcb-util-cursor
  - xcb-util-image
  - xcb-util-keysyms
  - xcb-util-renderutil
  - xcb-util-wm

  - pip:
      # EDF reading and EEG analysis. edfio backs MNE's EDF export, used by
      # concatenate_recordings.py to write the concatenated recording back out.
      - mne==1.12.1
      - edfio

      # Scientific computing and data frames used by the notebook and pipeline.
      # Somnotate's pomegranate<1 dependency is not compatible with NumPy 2.
      - numpy==1.26.4
      - scipy==1.16.2
      - pandas==2.3.3
      - xarray==2026.2.0

      # Somnotate scoring. Keep scikit-learn aligned with the version used to
      # pickle the trained LDA models. pomegranate builds from source and needs
      # a working C/C++ compiler.
      - scikit-learn==1.6.1
      - pomegranate<1.0.0
      - pyedflib
      - six
      - lspopt

      # Notebook exploration and plotting.
      - matplotlib==3.10.9
      - jupyterlab==4.4.10
      - ipywidgets==8.1.7
      - mne-qt-browser==0.7.5

      # Runtime config parsing and Parquet output support.
      - PyYAML==6.0.3

      # Shared paths/visualisation and scoring are developed in sibling
      # checkouts and installed in editable mode.
      - -e ../hypnose-helpers
      - -e ../hypnose-somnotate

      # Install this script-only project and validate its dependency metadata.
      - -e .[dev]
