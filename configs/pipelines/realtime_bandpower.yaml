name: realtime_bandpower

ingest:
  reader: stream_reader
  expected_sample_rate_hz: 256
  channels:
    - Fp1
    - Fp2
    - F3
    - F4
    - C3
    - C4
    - P3
    - P4
    - O1
    - O2

preprocessing:
  notch_hz: 50
  highpass_hz: 1.0
  lowpass_hz: 45.0
  window_seconds: 2.0
  hop_seconds: 0.5

features:
  - type: bandpower
    bands:
      delta: [1.0, 4.0]
      theta: [4.0, 8.0]
      alpha: [8.0, 12.0]
      beta: [12.0, 30.0]

outputs:
  write_raw_windows: false
  write_features: true
  include_qc_flags: true
