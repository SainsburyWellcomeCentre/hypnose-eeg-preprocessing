name: somnotate_sleep_scoring

sleep_scoring:
  # Required. An absolute path, a path relative to the derivatives root, or a
  # model name resolved as derivatives/somnotate_training/<name>/model.pickle.
  model_path: somnotate_training/somno_model_1/model.pickle

  # These must match the raw EDF and the model's training assumptions. Either
  # spelling works -- with or without the repeated "EEG "/"EMG " modality prefix
  # (score_recordings.py resolves against whichever the actual EDF has).
  sampling_rate_hz: 512
  channel_labels:
    - "EEG1A-B"
    - "EEG2A-B"
    - "EMG"

  export_visbrain: true

  # When false, a recording whose predictions parquet already exists is skipped
  # so a partially-completed session can be resumed without rescoring. Set true
  # (or pass --overwrite) to rescore regardless.
  overwrite: false

  # If true, every scoring chunk is normalized against robust statistics pooled
  # across the whole recording (gap/too_short epochs excluded) instead of each
  # chunk's own statistics -- see hypnose_somnotate.preprocessing.preprocessing.
  # compute_global_normalization_stats. Matters most for recordings split into
  # several independent chunks by long gaps.
  global_normalization: true

  # Middle gaps (dropouts, concatenation gaps, prescan artifact periods) longer
  # than this split the recording into separately scored chunks; shorter ones
  # are scored through and labelled Undefined. See hypnose_somnotate.
  # preprocessing.gap_correction.prepare_recording.
  max_single_gap_s: 300

  # Scoring chunks shorter than this -- including a whole recording that is
  # this short after trimming leading/trailing gaps -- are left unscored:
  # labelled Undefined with kind "too_short" in the predictions parquet, since
  # the HMM has too little context to score them reliably.
  min_segment_length_s: 300

  # If true, the long artifact periods written by the pre-scoring scan
  # (hypnose_eeg/preprocessing/prescan_artifacts.py, configured under
  # artifact_prescan in configs/pipelines/artifact_detection.yaml) are left
  # unscored: labelled Undefined with kind "artifact" in the predictions
  # parquet, and kept out of normalization. A recording without prescan output
  # is scored in full, with a warning.
  use_artifact_prescan: true

  # Short recordings are too short to give a representative normalization
  # baseline of their own: a few hours dominated by one state shift the robust
  # mean/std towards that state, which the model then mis-scores. Every scored
  # recording saves its own pooled statistics
  # (<recording>_somnotate_normalization.npz, beside its predictions); a
  # recording with less scoreable signal than min_signal_hours is normalized
  # against those of a long recording of the same animal instead. See
  # hypnose_eeg/sleep_scoring/reference_normalization.py.
  reference_normalization:
    enabled: true
    # Scoreable signal (after gaps and prescan artifact exclusions), not file
    # length, below which a reference baseline is used.
    min_signal_hours: 6
    # Electrode impedance drifts, so the reference must be recent.
    max_reference_age_days: 14
    # previous: the nearest earlier session; nearest: either direction (an
    # earlier session wins a tie).
    prefer: previous
    # A candidate whose statistics sit more than this many reference SDs from
    # the short recording's own on any channel (median over frequency bins) is
    # rejected and the next one tried: a gain or impedance change between
    # sessions makes a borrowed baseline unsafe (sub-053 ses-007 against
    # ses-006 sat about 4 SD away and turned most NREM into REM). null
    # disables the check.
    max_offset_z: 1.0
    # Optional explicit reference for short recordings, as a session number
    # (3, ses-3) or a date (YYYYMMDD). Overrides prefer, the age limit and
    # max_offset_z (with a warning).
    reference_session: null

  # Predicted-state display labels, shared by every QC report. "Undefined" covers
  # unscored epochs and has no display color.
  sleep_state_names:
    0: "Wake"
    1: "NREM"
    2: "REM"
    3: "Undefined"

  # Display colors for the scoreable states, shared by every QC plot.
  state_colors:
    0: "red"
    1: "royalblue"
    2: "goldenrod"

# Interactive visual quality check for predictions already written by scoring.
# Subject and date/session are always passed on the command line.
sleep_scoring_view:
  recording_index: 0
  eeg_channel: 0       # 0=EEG1, 1=EEG2
  view_length_s: 600
  hours: null           # Optional [start, end] elapsed hours, e.g. [3, 6]
  # Alternative real-time range, e.g. ["20260717 03:00:00", "20260717 06:00:00"]
  time_range: null
  # Optional display downsampling, e.g. 128. A pre-downsampled FIF under
  # derivatives (hypnose_eeg/preprocessing/downsample_recordings.py) is used
  # instead of the EDF whenever one is available and its rate satisfies this
  # -- even left null, in which case any available FIF is still used, at its
  # own rate, since it's faster to read than the full-rate EDF. Set this
  # higher than any available FIF's rate to force reading the EDF.
  display_rate_hz: 128
  show_artifacts: false # Shade regions flagged by artifact_epochs.parquet
  show_gaps: true # Shade 'gap'/'artifact'/'too_short' spans from the predictions parquet's kind column
