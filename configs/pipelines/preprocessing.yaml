name: preprocessing

source:
  uri: null  # resolved from the active data-location profile
  glob: "**/*.edf"

sink:
  uri: null  # resolved from the active data-location profile; used by downsample only

preprocessing:
  concatenate:
    sink_dir: null
    manifest: null
  downsample:
    target_sfreq: 128
    manifest: null
  trim_channels:
    # Duplicate channel labels are dropped automatically; --keep-first N on the
    # command line is the manual alternative and is deliberately not configurable.
    # n_samples: initial samples compared between duplicate channels and printed
    # with --dry-run. output_suffix is also read by concatenate_recordings.py so it
    # picks trimmed parts; the downsample/scoring/QC selection helpers only
    # recognise the default "_trimmed" (scripts/utils/recording_selection.py).
    n_samples: 100
    output_suffix: "_trimmed"
