name: preprocessing

source:
  uri: null  # resolved from the active data-location profile
  glob: "**/*.edf"

sink:
  uri: null  # resolved from the active data-location profile; used by downsample only

preprocessing:
  concatenate:
    sink_dir: null
    manifest: null
  downsample:
    target_sfreq: 128
    manifest: null
  trim_channels:
    n_samples: 100
    keep_first: 3
    output_suffix: "_trimmed"
