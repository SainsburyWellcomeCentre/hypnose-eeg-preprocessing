name: state_dependent_artifact_detection

artifact_detection:
  epoch_seconds: 4.0

  sleep_scoring:
    time_column: "time_s"
    state_column: "label"
    unscored_numeric_state: -1
    unscored_text_state: "unscored"

  chunking:
    target_memory_mb: 128.0
    working_array_factor: 8
    max_chunk_epochs: 2048

  welch:
    segment_seconds: 2.0
    minimum_frequency_hz: 1.0
    maximum_frequency_hz: 55.0
    high_frequency_band_hz: [20.0, 45.0]
    line_noise_band_hz: [49.0, 51.0]

  thresholds:
    robust_z: 5.0
    extreme_z: 8.0
    minimum_standard_deviation_uv: 0.1
    maximum_edge_fraction: 0.02
    robust_mad_scale: 1.4826
    soft_features_required: 2
    emg_soft_features_required: 2
    emg_supported_eeg_features_required: 1

  features:
    eeg_score_features:
      - "peak_to_peak_uv"
      - "rms_uv"
      - "max_derivative_uv_per_sample"
      - "high_frequency_power_uv2"
      - "line_noise_power_uv2"
    emg_score_features:
      - "emg_peak_to_peak_uv"
      - "emg_rms_uv"
      - "emg_max_derivative_uv_per_sample"

  output:
    suffix: "artifact_epochs"
    overwrite: false

# Pre-scoring scan for long periods of unusable signal (hypnose_eeg/preprocessing/
# prescan_artifacts.py). Runs before sleep scoring, without sleep states; the
# periods it finds are left unscored by somnotate (score_recordings.py, see
# sleep_scoring.use_artifact_prescan). Epoch length, chunking and Welch
# settings are shared with artifact_detection above.
artifact_prescan:
  dead_signal:
    # An EEG channel-epoch whose RMS over the analysed band
    # (welch.minimum_frequency_hz..maximum_frequency_hz) is below this carries
    # no EEG -- e.g. a disconnected headstage drifting slowly. Absolute, so it
    # still works when most of a recording is dead. Calibrated on 15 sessions
    # (Sept 2026): dead signal sits at ~3.5 uV, while the 1st percentile of
    # clean recordings is 27-33 uV.
    minimum_broadband_rms_uv: 10.0

  hard_failure:
    maximum_edge_fraction: 0.02

  extreme:
    # Robust z-scores per channel against the recording's live (not dead, not
    # hard-failure) epochs, without sleep states -- so this must stay far above
    # the post-scoring threshold, or ordinary active wake gets excluded. On the
    # calibration sessions 10 excluded nothing from normal recordings, while 8
    # and 6 began excluding stretches that sleep scoring had called Wake.
    robust_z: 10.0
    features_required: 2
    features:
      - "peak_to_peak_uv"
      - "rms_uv"
      - "max_derivative_uv_per_sample"
      - "high_frequency_power_uv2"

  periods:
    # Flagged runs separated by at most this much clean signal are one run.
    merge_within_s: 30.0
    # Runs shorter than this are left to the post-scoring detector.
    minimum_run_s: 60.0
    # Periods separated by less than this much clean signal are bridged into
    # one continuous period.
    bridge_gap_s: 300.0

  output:
    suffix: "prescan_artifacts"
    overwrite: false
