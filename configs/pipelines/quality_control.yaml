name: quality_control_thresholds

# Shared severity ranking for QC statuses, used to pick the most severe result
# across sections/channels/states. Higher values are more severe.
performance_check:
  pass: 0
  review: 1
  fail: 2

quality_control:
  recording_integrity:
    duration_tolerance_s: 1.0
    min_gap_s: 1.0
    gap_scan_chunk_seconds: 1800.0
    max_gap_percent: 1.0
    max_longest_gap_s: 600.0

  somnotate_scoring:
    confidence_threshold: 0.80
    max_low_confidence_percent: 10.0
    max_undefined_percent: 5.0

  # Flags a recording for review when its predicted sleep-state mix looks
  # physiologically implausible -- percentages are of scored signal epochs
  # (kind == "signal"), excluding gap/too_short/unscored time.
  sleep_state_proportions:
    max_wake_percent: 75.0
    max_nrem_percent: 75.0
    max_rem_percent: 20.0

  artifacts:
    max_artifact_percent: 5.0

  # Flags a recording for review when the pre-scoring artifact scan
  # (hypnose_eeg/preprocessing/prescan_artifacts.py) excluded more than this
  # percentage of the recording from sleep scoring. The artifacts section above
  # only covers scored signal, so without this a mostly-excluded recording
  # would pass. A recording with no prescan output is also sent to review.
  artifact_prescan:
    max_excluded_percent: 5.0

  channel_correlation:
    eeg_eeg_threshold: 0.90
    eeg_emg_threshold: 0.50
    max_correlation_review_percent: 2.0

# Headless review figures (hypnose_eeg/qc/review_figures.py), saved as PNGs in
# the session's quality-control directory after the QC summary -- the
# no-display alternative to opening the interactive scoring viewer. Each is
# drawn "review" (only when the QC summary is not a plain pass), "always", or
# "never"; with both at "review", a session that passes gets no figures.
review_figures:
  # The scoring overview: the traces, derived envelopes, and Somnotate states
  # as the viewer shows them, over `hours` elapsed from the session start.
  scoring: review
  hours: [0, 12]
  # The sleep-state power spectra and EMG RMS figures, with their spectral
  # quality CSV.
  spectra: review
  # Shade the detected artifact epochs (needs artifact detection to have run).
  show_artifacts: true
  width_in: 24
  dpi: 150
