environment: dev

source:
  kind: mounted-edf
  source_id: "hypnose-eeg-raw-edf"
  uri: "data/rawdata"
  format: "edf"
  glob: "**/*.edf"

sink:
  kind: filesystem
  uri: "data/derivatives"
  format: "parquet"
  partition_by:
    - "session_date"
    - "subject_id"

checkpoint:
  kind: local-file
  uri: "state/checkpoint_dev.json"

runtime:
  max_retry_count: 3
  retry_backoff_seconds: 2

logging:
  level: INFO
  metrics_namespace: "hypnose_eeg"
