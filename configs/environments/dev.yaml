environment: dev

source:
  kind: mounted-edf
  source_id: "hypnose-eeg-raw-edf"
  uri: "data/rawdata"
  format: "edf"
  glob: "**/*.edf"

sink:
  kind: filesystem
  uri: "data/derivatives"
  format: "fif"
  partition_by:
    - "session_date"
    - "subject_id"

preprocessing:
  downsample:
    target_sfreq: 128
    output_format: "fif"
    manifest: "data/derivatives/edf_downsample_manifest.csv"

checkpoint:
  kind: local-file
  uri: "state/checkpoint_dev.json"

runtime:
  max_retry_count: 3
  retry_backoff_seconds: 2

logging:
  level: INFO
  metrics_namespace: "hypnose_eeg"
