environment: dev

source:
  kind: mounted-edf
  source_id: "hypnose-eeg-raw-edf"
  uri: "data/rawdata"
  format: "edf"
  glob: "**/*.edf"
  epoch_seconds: 10.0

sink:
  kind: filesystem
  uri: "/Volumes/eeg-results/processed"
  format: "parquet"
  partition_by:
    - "session_date"
    - "subject_id"

checkpoint:
  kind: local-file
  uri: "state/checkpoint_dev.json"
  flush_every_batches: 5

runtime:
  batch_size_samples: 1024
  max_retry_count: 3
  retry_backoff_seconds: 2

logging:
  level: INFO
  metrics_namespace: "hypnose_eeg"
