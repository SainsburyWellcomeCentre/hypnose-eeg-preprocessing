[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypnose-eeg-preprocessing"
version = "0.1.0"
description = "Tools and analysis scripts for Hypnose EEG recordings."
readme = "readme.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hypnose-helpers>=0.1,<0.2",
    "hypnose-somnotate>=1.0,<2",
    "numpy>=1.26,<2",
    "scipy>=1.16,<2",
    "pandas>=2.3,<3",
    "xarray>=2026.2,<2027",
    "pyarrow>=20",
    "matplotlib>=3.10,<4",
    "mne>=1.12,<1.13",
    # Backs MNE's EDF export, used to write concatenated recordings.
    "edfio",
    "PyYAML>=6,<7",
    # Scoring models pickle a scikit-learn LDA transformer at this version.
    "scikit-learn==1.6.1",
    # The vendored Somnotate API uses pomegranate's pre-1.0 interface.
    "pomegranate<1.0.0",
    "pyedflib",
    "six",
    "lspopt",
]

# Development-only dependencies; `uv sync` installs both groups by default.
[dependency-groups]
notebook = [
    "jupyterlab>=4.4,<5",
    "ipywidgets>=8.1,<9",
    "mne-qt-browser>=0.7,<0.8",
    "PyQt6>=6.10,<7",
]
dev = [
    "pytest>=8,<9",
]

# Console scripts for the pipeline stages and tools; `python -m <module>` runs
# the same entry points.
[project.scripts]
hypnose-eeg-pipeline = "hypnose_eeg.pipeline.run:main"
hypnose-eeg-preprocess = "hypnose_eeg.pipeline.preprocessing:main"
hypnose-eeg-score = "hypnose_eeg.pipeline.sleep_scoring:main"
hypnose-eeg-qc = "hypnose_eeg.pipeline.qc:main"
hypnose-eeg-qc-review = "hypnose_eeg.pipeline.qc_review:main"
hypnose-eeg-qc-spectra = "hypnose_eeg.qc.spectra:main"
hypnose-eeg-view = "hypnose_eeg.sleep_scoring.view_scoring:main"
hypnose-eeg-locations = "hypnose_eeg.io.repository_paths:main"

# src layout: `src/hypnose_eeg` is the importable package, pipeline stages
# included (`hypnose_eeg.pipeline`, with `hypnose_eeg.api` as its Python
# facade). Configuration stays in the repository's `configs/`, so install in
# editable mode (`uv sync` does this); tests run against that install.
[tool.setuptools.packages.find]
where = ["src"]
include = ["hypnose_eeg*"]

[tool.setuptools.package-data]
"hypnose_eeg.io" = ["checkpoints/*.json"]

[tool.uv]
default-groups = ["dev", "notebook"]

# Shared paths/visualisation and scoring are developed in sibling checkouts.
[tool.uv.sources]
hypnose-helpers = { path = "../hypnose-helpers", editable = true }
hypnose-somnotate = { path = "../hypnose-somnotate", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
